# Checks the site's layout in Chromium and WebKit (Safari's engine) when a
# pull request changes index.html or how the site is put together, by
# comparing it with the base branch. Both are put together the way
# deploy-site.yml publishes them (.github/build-site.sh):
#
#   - Phone (iPhone 15, 393x852): the page content starts right after the
#     sidebar, instead of a screen-tall sidebar with empty space.
#   - PC (1440x900): the sidebar fills the window and the About page looks
#     exactly as before, pixel for pixel (if the pull request replaces the
#     app screenshot on About, everything except that image).
#   - Ads off (all the checks above run like this): no page shows an ad, and
#     the only ad file the page asks for is Google's AdSense script (Google
#     checks the site with it).
#   - Ads on, with made-up ad unit IDs: the About and Download ad boxes keep
#     250 px for the ad (the page doesn't jump when it loads), sit outside
#     forms, and are at least 150 px from any button or download link. The
#     Download one only shows once a system is picked.
#   - Every page has its own address (/, /download/, /profiles/, /privacy/)
#     and title. Opening or reloading one shows that page, and old links
#     (/#download and so on) land on the new address.
#   - getcounterlock.com/privacy/ (the privacy policy address for AdSense)
#     is the Privacy & rules page.
#   - Cloudflare Web Analytics loads on every page (a stand-in for it, so
#     the test isn't counted as a visit), all the ad checks above still pass
#     with it, and page switches (sidebar buttons, links, Back, Forward)
#     count as page views, each under its page's address.
#   - The counter pages, made from the latest release's Counterlock-web.zip
#     like deploy-site.yml does: /counter/abrams/ at phone and PC size (same
#     layout, its own title, description, canonical address and one H1,
#     breadcrumbs, the ad rules, analytics), /counter/, 404.html,
#     sitemap.xml and robots.txt, and that /app/?enemy=abrams opens the web
#     version with Abrams picked.
#
# Before and after screenshots (About, Download, Counter Profiles, Privacy)
# from both engines are kept under the run's "Artifacts" for 14 days. The scripts are in .github/layout-check/. None of
# this is published: the site leaves out .github.
name: Layout check

on:
  pull_request:
    paths:
      - index.html
      - robots.txt
      - og-image.png
      - .github/build-site.sh
      - .github/build-pages.py
      - .github/layout-check/**
      - .github/workflows/layout-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: Layout (Chromium and WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: The pull request's version
        uses: actions/checkout@v5
        with:
          path: after
      - name: The base branch's version
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: before
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Pillow (compares screenshots)
        timeout-minutes: 5
        run: python -m pip install pillow
      - name: WebKit's system packages from earlier runs
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: layout-debs-ubuntu-24.04-playwright-1.56
      - name: Browsers (Chromium and WebKit)
        timeout-minutes: 20
        run: |
          # Keep the downloaded packages in ~/apt-debs (cached above), so a
          # slow Ubuntu mirror only matters the first time.
          mkdir -p ~/apt-debs/partial
          printf 'Dir::Cache::Archives "%s/apt-debs/";\nAPT::Keep-Downloaded-Packages "true";\n' "$HOME" \
            | sudo tee /etc/apt/apt.conf.d/99-keep-debs
          npm install -g playwright@1.56
          playwright install --with-deps chromium webkit
          sudo chown -R "$USER" ~/apt-debs
      - name: Web version from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same zip deploy-site.yml publishes at /app/ and makes the
          # counter pages from. None yet: the sites are checked without them.
          gh release download --repo "$GITHUB_REPOSITORY" --pattern Counterlock-web.zip --dir web-zip \
            || echo "::warning::The latest release has no Counterlock-web.zip, so the counter pages aren't checked."
      - name: Both sites as they'd be published
        run: |
          zip=$(ls web-zip/Counterlock-web.zip 2>/dev/null || true)
          bash after/.github/build-site.sh before site-before $zip
          bash after/.github/build-site.sh after site-after $zip
      - name: Screenshots and checks
        timeout-minutes: 10
        run: |
          export NODE_PATH="$(npm root -g)"
          for engine in chromium webkit; do
            node after/.github/layout-check/shots.cjs "$PWD/site-before" "$PWD/shots/before" "$engine"
            node after/.github/layout-check/shots.cjs "$PWD/site-after" "$PWD/shots/after" "$engine"
          done
          python after/.github/layout-check/check.py shots/before shots/after
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: layout-screenshots
          path: shots/
          retention-days: 14
